apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${BUILD_REPOSITORY_NAME}-ingress
  namespace: ${NAMESPACE}
  labels:
    service: app
  annotations:
    nginx.org/client-max-body-size: '0'
    nginx.org/location-snippets: |
      proxy_request_buffering off;
    nginx.org/proxy-buffer-size: 16k
    nginx.org/proxy-buffers: 8 16k
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/issue-temporary-certificate: 'true'
spec:
  # Required, not optional: the NGINX Inc controller on these clusters only picks up
  # ingresses whose class matches, so a classless ingress is served by nothing.
  ingressClassName: nginx
  tls:
    - hosts:
        - ${BRATISKA_HOSTNAME}
      secretName: ${BUILD_REPOSITORY_NAME}-tls
  rules:
    - host: ${BRATISKA_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: ${BUILD_REPOSITORY_NAME}-app
                port:
                  number: 80