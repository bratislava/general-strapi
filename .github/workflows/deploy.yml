name: Strapi deploy pipeline
on:
  push:
    tags:
      - "dev**"
      - "staging**"
      - "prod**"
    branches:
      - master

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Environment
    runs-on: bratislava
    outputs:
      cluster: ${{ steps.resolve.outputs.cluster }}
    steps:
      - name: Map ref to environment
        id: resolve
        run: |
          REF="$GITHUB_REF"

          if [[ "$REF" == "refs/heads/master" ]]; then
            CLUSTER="staging"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
            case "$TAG" in
              dev*)     CLUSTER="development" ;;
              staging*) CLUSTER="staging" ;;
              prod*)    CLUSTER="production" ;;
              *)
                echo "::error::Unable to determine environment from tag: $TAG"
                exit 1
                ;;
            esac
          else
            echo "::error::Unable to determine environment from ref: $REF"
            exit 1
          fi

          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"

          {
            echo "## Pipeline info :rocket:"
            echo ":arrow_right: Ref: **$REF**"
            echo ":arrow_right: Cluster: **$CLUSTER**"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Strapi
    needs: resolve
    uses: ./.github/workflows/build-single-image.yml
    secrets: inherit
    with:
      directory: ./
      image: harbor.bratislava.sk/standalone/general-strapi
      cluster: ${{ needs.resolve.outputs.cluster }}

  deploy:
    name: Strapi
    needs: [resolve, build]
    uses: bratislava/github-actions/.github/workflows/trigger-infra-deploy.yml@v3.0.1
    secrets: inherit
    with:
      cluster: ${{ needs.resolve.outputs.cluster }}
      app: general-strapi
