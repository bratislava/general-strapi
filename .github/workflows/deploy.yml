name: Build Strapi for testing and then Deploy pipeline
on:
  push:
    tags:
      - 'dev**'
      - 'staging**'
      - 'prod**'
    branches:
      - master

jobs:
  buildstrapi:
    name: build Strapi before deploy
    uses: bratislava/github-actions/.github/workflows/build-with-bratiska-cli-inhouse.yml@v2.3.2
    with:
      directory: ./
      debug: --debug
    secrets:
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
    permissions: write-all

  conditions:
    name: Check for cluster conditions
    needs: [buildstrapi]
    uses: bratislava/github-actions/.github/workflows/cluster-deploy-conditions.yml@v2.3.2

  deploy-dev:
    name: deploy strapi to dev
    if: needs.conditions.outputs.dev == 'true'
    needs: [conditions]
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.3.2
    with:
      directory: ./
      cluster: development
      url: https://dev.tkgis.bratislava.sk:6443
      debug: --debug
    secrets:
      service-account: ${{ secrets.DEV_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-staging:
    name: deploy strapi to staging
    if: needs.conditions.outputs.staging == 'true'
    needs: [conditions]
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.3.2
    with:
      directory: ./
      cluster: staging
      url: https://stage.tkgis.bratislava.sk:6443
      debug: --debug
      flag: --staging
    secrets:
      service-account: ${{ secrets.STAGING_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-prod:
    name: deploy strapi to prod
    if: needs.conditions.outputs.prod == 'true'
    needs: [conditions]
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.3.2
    with:
      directory: ./
      cluster: production
      url: https://prod.tkgis.bratislava.sk:6443
      flag: --production
    secrets:
      service-account: ${{ secrets.PROD_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
